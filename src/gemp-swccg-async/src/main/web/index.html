    <script type="text/javascript">
        jQuery.fn.center = function () {
            this.css("position", "absolute");
            this.css("top", (($(window).height() - this.outerHeight()) / 2));
            this.css("left", (($(window).width() - this.outerWidth()) / 2));
            return this;
        };

        var comm = new GempSwccgCommunication(GEMP_SERVER, function () {
            alert("Unable to contact the server");
        });

        // #512: one sign-in page. Play has no password box of its own any more: "Sign in" starts Play's
        // normal sign-in (state, nonce, PKCE) and the browser goes to swccg.com/login, where Google,
        // Discord, passkeys, password, "Forgot your password?" and "Create an account" all live.
        // ?return=/play/... (same origin, checked again by the server) brings you back to that page.
        function signInHref() {
            var m = /[?&]return=([^&#]*)/.exec(window.location.search);
            var ret = m ? decodeURIComponent(m[1]) : "";
            var ok = /^\/play\/[A-Za-z0-9._~!&()*+=:@%\/?-]*$/.test(ret) && ret.indexOf("..") < 0;
            return GEMP_SERVER + "/oidc/start" + (ok ? "?return=" + encodeURIComponent(ret) : "");
        }

        function signInScreen() {
            $(".interaction").html("");
            if (/[?&]sso_error=/.test(window.location.search))
                $(".error").text("Sign-in didn't finish. Try again.");
            var go = $("<a id='signInButton'>Sign in</a>").attr("href", signInHref()).button();
            $(".interaction").append(go);
            $(".interaction").append("<p>Sign in or create an account on the swccg.com sign-in page. One account for Play, the wiki and the forum.</p>");
            $(".interaction").append("<p>Play the LOTR-TCG on GEMP at <a href='https://play.lotrtcgpc.net'>play.lotrtcgpc.net</a></p>");
        }

        $(document).keydown(function (e) {
            if (e.which === 8 && !$(e.target).is("input, textarea")) {
                e.preventDefault();
            }
        });

        $(document).ready(
                function () {
                    comm.getStatus(
                            function(html) {
                                $(".status").append(html);
                            });
                    // #559: one login. Already signed in (here, on the forum or on the wiki)? Then go
                    // straight to the page you asked for, or the hall, instead of showing "Sign in".
                    // A 401 (not signed in) or no answer within 4 seconds shows the Sign in button.
                    $.ajax({
                        type: "GET",
                        url: GEMP_SERVER + "/deck/list",
                        cache: false,
                        timeout: 4000,
                        success: function () {
                            var m = /[?&]return=([^&#]*)/.exec(window.location.search);
                            var ret = m ? decodeURIComponent(m[1]) : "";
                            var ok = /^\/play\/[A-Za-z0-9._~!&()*+=:@%\/?-]*$/.test(ret) && ret.indexOf("..") < 0 &&
                                !/^\/play\/(?:index\.html)?(?:\?|$)/.test(ret);
                            window.location.replace(ok ? ret : "hall.html");
                        },
                        error: function () {
                            signInScreen();
                            $(".centerContainer").center();
                        }
                    });
                    $(".centerContainer").center();
                });
