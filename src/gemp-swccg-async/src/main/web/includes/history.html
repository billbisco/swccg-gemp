<script type="text/javascript">
    $(document).ready(
        function () {
            var ui = new GameHistoryPageUI("/gemp-swccg-server", $("#historyMain"));
            // #history?.. hall links (hallLinks.js) set the filters; the page opens on the link it was opened with,
            // or on the filters it last showed
            window.GempHistoryPage = ui;
            var hash = window.location.hash;
            var remembered = window.GempLinks ? GempLinks.lastLinks["account/history"] : null;
            var isHistoryLink = function (h) {
                return /^#(account\/history|history)\?/.test(h || "");
            };
            var link = isHistoryLink(hash) ? hash : (isHistoryLink(remembered) ? remembered : null);
            ui.show(link ? GempLinks.parseQuery(link.substring(link.indexOf("?") + 1)) : {});
        });
</script>
<div class="hall-page history-page">
    <h1>My Game History</h1>
    <div id="historyMain"></div>
</div>
