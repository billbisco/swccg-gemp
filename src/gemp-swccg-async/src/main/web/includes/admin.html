<script type="text/javascript">
	// Admin tab (LOTR includes/admin.html): sub-tabs down the left side, each page fetched once (GempHallTabs.loadOnce,
	// gameHall.js).  Links: #admin/general, #admin/league, #admin/users, #admin/playtesting, #admin/commentator
	// (hallLinks.js).  Which sub-tabs a player sees follows the flags of the hall's player info, as before:
	//   a  administrator (everything)      l  league admin        p  playtesting admin      m  commentator admin
	// The server checks the same flags on every request, so hiding a tab is a convenience, not the access control.
	$("#adminMain").ready(
		function () {
			$("#adminMain").tabs().addClass("ui-tabs-vertical ui-helper-clearfix");
			$("#admin-tabs > ol > li").removeClass("ui-corner-top").addClass("ui-corner-left");

			$("#landingTab").parent().hide();
			$("#landing").hide();

			var type = (hall && hall.userInfo && hall.userInfo.type) ? hall.userInfo.type : "";
			var has = function (flag) {
				return type.indexOf(flag) >= 0;
			};

			if (!has("a")) {
				$("#generalTab").parent().hide();
				$("#banTab").parent().hide();
			}
			if (!(has("l") || has("a")))
				$("#leagueTab").parent().hide();
			if (!(has("p") || has("a")))
				$("#playtestingTab").parent().hide();
			if (!(has("m") || has("a")))
				$("#commentatorTab").parent().hide();

			var index = $("#admin-tabs li").index($("#admin-tabs li:visible").eq(0));
			$("#adminMain").tabs("option", "active", index);

			// a link to a sub-tab (#admin/league) can be opened now that the visible tabs are known
			if (window.GempLinks)
				GempLinks.poke();
		});
</script>

<div id="adminMain" class="hall-tab flex-horiz">
	<div id="admin-tabs" class="sub-tabs">
		<ol>
			<li><a id="landingTab" href="#landing"></a></li>
			<li><a id="generalTab" href="includes/admin/generalAdmin.html?v=20261020d">General Admin</a></li>
			<li><a id="leagueTab" href="includes/admin/leagueAdmin.html?v=20261021a">League Admin</a></li>
			<li><a id="banTab" href="includes/admin/userAdmin.html?v=20261020d">User Moderation</a></li>
			<li><a id="playtestingTab" href="includes/admin/playtestingAdmin.html?v=20261020d">Playtesting Admin</a></li>
			<li><a id="commentatorTab" href="includes/admin/commentatorAdmin.html?v=20261020d">Commentator Admin</a></li>
		</ol>
	</div>
	<div id="landing">
	</div>
</div>
