---
# Keeps the card blueprint database files in step with the card classes (swccg-guild/work#284).
# card_blueprint_database.json, _light.json and _dark.json are generated by bin/regen-blueprint-db.
# Only this workflow writes them: PRs and Players Committee syncs carry Java only.
name: regen-blueprint-db
on:
  push:
    branches:
      - master
    paths:
      - 'src/gemp-swccg-cards/src/main/java/**'
      - 'src/gemp-swccg-logic/src/main/java/**'
      - 'src/gemp-swccg-common/src/main/java/**'
      - 'src/gemp-swccg-server/src/main/java/com/gempukku/swccgo/util/CardDataExporter.java'
      - 'bin/regen-blueprint-db'
      - '.github/workflows/regen-blueprint-db.yml'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, and never cancel: a queued run regenerates from the newest master anyway.
concurrency:
  group: regen-blueprint-db
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate card blueprint database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Regenerate
        run: bin/regen-blueprint-db

      - name: Commit and push if changed
        run: |
          files="src/gemp-swccg-cards/src/main/resources/card_blueprint_database.json src/gemp-swccg-cards/src/main/resources/card_blueprint_database_light.json src/gemp-swccg-cards/src/main/resources/card_blueprint_database_dark.json"
          if git diff --quiet -- $files; then
            echo "Card blueprint database already up to date."
            exit 0
          fi
          git config user.name billbisco
          git config user.email billbisco@users.noreply.github.com
          git add $files
          git commit -q -m "Regenerate card blueprint database" -m "Generated from the card classes at $(git rev-parse --short HEAD) by the regen-blueprint-db workflow. swccg-guild/work#284"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git pull --rebase origin master
          done
          echo "::error::Could not push the regenerated files; run bin/regen-blueprint-db and commit them."
          exit 1
