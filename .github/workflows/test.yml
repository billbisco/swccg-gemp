---
name: test-on-push
on:
  push:
    branches:
      - master
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Maven unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: mvn build
        run: mvn clean verify -Dsurefire.rerunFailingTestsCount=1
        working-directory: src

      - name: Upload packaged app jar
        uses: actions/upload-artifact@v4
        with:
          name: web-jar
          path: src/gemp-swccg-async/target/web.jar
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download packaged app jar
        uses: actions/download-artifact@v4
        with:
          name: web-jar
          path: src/gemp-swccg-async/target

      - name: Pre-pull MariaDB base image
        run: |
          for i in 1 2 3; do
            docker pull public.ecr.aws/docker/library/mariadb:11 && exit 0
            sleep $((i*15))
          done
          docker pull mariadb:11
          docker tag mariadb:11 public.ecr.aws/docker/library/mariadb:11

      - name: Build Docker stack
        working-directory: src
        run: |
          docker compose build

      - name: Start Docker stack
        working-directory: src
        timeout-minutes: 15
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          APP_URL="http://127.0.0.1:${APP_PORT}/gemp-swccg/index.html"

          start_stack() {
            docker compose up -d --force-recreate db
            timeout 180 bash -c '
              until docker compose exec -T db sh -c "mariadb-admin ping -uroot \
                  -p\"$MYSQL_ROOT_PASSWORD\" --silent"; do
                echo "Waiting for DB to be ready..."
                docker compose logs --tail=20 db || true
                sleep 5
              done
            '
            docker compose up -d --force-recreate build
            timeout 240 bash -c '
              url="$1"
              until curl -fSs --max-time 10 --output /dev/null "$url"; do
                echo "Waiting for app to respond at ${url}..."
                docker compose ps
                docker compose logs --tail=50 build || true
                docker compose exec -T build sh -c "tail -n 50 /root/nohup.out \
                  || tail -n 50 /opt/gemp-swccg/src/nohup.out" || true
                sleep 5
              done
            ' bash "${APP_URL}"
          }

          if ! start_stack; then
            echo "First stack start failed; retrying once..."
            docker compose down --remove-orphans || true
            sleep 5
            start_stack
          fi

      - name: Run saved-game DB tests
        working-directory: src
        timeout-minutes: 10
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          mvn -B -pl gemp-swccg-server -am test -Dtest=DbGameSaveDAOTests,DbMetricsDAOTests \
            -Dsurefire.failIfNoSpecifiedTests=false \
            "-Dgemp.test.dbUrl=jdbc:mysql://127.0.0.1:${DB_PORT}/${MYSQL_DATABASE}" \
            "-Dgemp.test.dbUser=${MYSQL_USER}" "-Dgemp.test.dbPassword=${MYSQL_PASSWORD}"
          report=gemp-swccg-server/target/surefire-reports/TEST-com.gempukku.swccgo.game.save.DbGameSaveDAOTests.xml
          grep -q 'tests="2"' "$report"
          grep -q 'skipped="0"' "$report"
          metrics=gemp-swccg-server/target/surefire-reports/TEST-com.gempukku.swccgo.metrics.DbMetricsDAOTests.xml
          grep -q 'tests="1"' "$metrics"
          grep -q 'skipped="0"' "$metrics"

      - name: Run integration tests
        working-directory: src
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          python3 -m pip install --requirement requirements.txt
          python3 -u gemp_client_test.py

      - name: Show Docker diagnostics on failure
        if: failure()
        working-directory: src
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true
